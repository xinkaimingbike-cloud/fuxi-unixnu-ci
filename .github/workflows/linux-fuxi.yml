name: fuxi kernel

# Split into two jobs so a failure in Build kernel only re-runs the kernel job.
# GitHub re-runs failed jobs only (not failed steps), so this is the only way to
# avoid paying for the ~50 minute toolchain build again.
#
#   prepare : toolchain + defconfig + fetch  -> caches /opt/unixnu-linux, uploads
#             the fetched sources as an artifact
#   kernel  : restores both, builds, uploads kernel.macho

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: 'defconfig'
        required: true
        default: 'fuxi_defconfig'
      steps:
        description: 'unixnu build steps'
        required: true
        default: 'kernel'

env:
  DEFCONFIG: ${{ inputs.defconfig }}
  STEPS: ${{ inputs.steps }}
  UNIXNU_DEVICE: ${{ github.workspace }}/device

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out UniXNU
        uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          path: unixnu
          submodules: false

      - name: Check out this repository
        uses: actions/checkout@v4
        with:
          path: ci

      - name: Run actions/setup-python@v5
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Unpack the fuxi device repository
        run: |
          tar -xzf ci/device-fuxi.tar.gz
          ls device | head -n 40
          test -f device/board.toml
          test -f "device/configs/$DEFCONFIG"
          grep -n 'Ath12kWifi' device/board.toml

      # unixnu fetch runs git submodule inside the device repository as well, so the
      # unpacked tree has to be a git checkout with a first commit.
      - name: Initialise the device repository
        run: |
          cd device
          git init -q
          git config user.email ci@localhost
          git config user.name ci
          git config commit.gpgsign false
          git add -A
          git commit -qm "fuxi device tree"
          git log --oneline -1
          test ! -f .gitmodules

      - name: Restore the host toolchain
        id: toolchain-cache
        uses: actions/cache@v4
        with:
          path: /opt/unixnu-linux
          key: unixnu-linux-${{ runner.os }}-${{ hashFiles('unixnu/scripts/linux/setup-toolchain.py') }}

      - name: Install host tools
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        timeout-minutes: 300
        run: |
          set -x
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git make cmake ninja-build unifdef lz4 xz-utils \
            pkg-config libssl-dev device-tree-compiler mtools bzip2 zip
          python3 scripts/linux/setup-toolchain.py --print-packages || true
          timeout 10800 sudo python3 scripts/linux/setup-toolchain.py
          du -sh /opt/unixnu-linux 2>/dev/null || true
        working-directory: unixnu

      - name: Install the small apt packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git make cmake ninja-build unifdef lz4 xz-utils \
            pkg-config libssl-dev device-tree-compiler mtools bzip2 zip

      - name: Report the runner toolchain
        run: |
          uname -a
          python3 --version
          for t in git make clang cmake ninja unifdef ld lzfse dtc; do
            printf '%-8s %s\n' "$t" "$(command -v "$t" || echo MISSING)"
          done
          ls /opt/unixnu-linux
          df -h /

      - name: Configure
        run: ./unixnu defconfig "$DEFCONFIG" -D "$UNIXNU_DEVICE"
        working-directory: unixnu

      - name: Fetch the sources
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./unixnu fetch
        working-directory: unixnu

      # The sm8550 feed resolves XNU to a newer revision (ac9718fb) than the one the
      # port's patch series is qualified for: scripts/build-xnu-4k-baseline.sh exits
      # with "unexpected XNU reference revision" unless refer/xnu is xnu-10063.141.1
      # (d8b8029). unixnu.lock only records the feed commit and is rewritten by fetch,
      # so the checkout has to be pinned here, after the fetch.
      - name: Pin the XNU reference revision
        env:
          UNIXNU_XNU_TAG: xnu-10063.141.1
          UNIXNU_XNU_COMMIT: d8b80295118ef25ac3a784134bcf95cd8e88109f
          UNIXNU_XNU_VERSION: 10063.141.1
        run: |
          XNU=out/fuxi/tree/refer/xnu
          if [ -e "$XNU" ] || [ -L "$XNU" ]; then rm -rf "$XNU"; fi
          mkdir -p "$(dirname "$XNU")"
          git clone -q --depth 1 --branch "$UNIXNU_XNU_TAG" \
            https://github.com/apple-oss-distributions/xnu.git "$XNU"
          test "$(git -C "$XNU" rev-parse HEAD)" = "$UNIXNU_XNU_COMMIT"
          git -C "$XNU" rev-parse HEAD
        working-directory: unixnu

      # The feeds are ~2 GiB; shipping them beats cloning them again in the kernel job.
      - name: Pack the fetched sources
        run: |
          cd unixnu
          tar -cJf "$RUNNER_TEMP/unixnu-out.tar.xz" out
          ls -lh "$RUNNER_TEMP/unixnu-out.tar.xz"
          df -h /

      - name: Upload the prepared tree
        uses: actions/upload-artifact@v4
        with:
          name: unixnu-prepared-${{ github.run_attempt }}
          path: ${{ runner.temp }}/unixnu-out.tar.xz
          retention-days: 3

  kernel:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Check out UniXNU
        uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          path: unixnu
          submodules: false

      - name: Check out this repository
        uses: actions/checkout@v4
        with:
          path: ci

      - name: Run actions/setup-python@v5
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Restore the host toolchain
        uses: actions/cache@v4
        with:
          path: /opt/unixnu-linux
          key: unixnu-linux-${{ runner.os }}-${{ hashFiles('unixnu/scripts/linux/setup-toolchain.py') }}

      - name: Install the small apt packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git make cmake ninja-build unifdef lz4 xz-utils \
            pkg-config libssl-dev device-tree-compiler mtools bzip2 zip

      - name: Unpack the fuxi device repository
        run: |
          tar -xzf ci/device-fuxi.tar.gz
          test -f device/board.toml
          test -f "device/configs/$DEFCONFIG"
          grep -n 'Ath12kWifi' device/board.toml

      - name: Initialise the device repository
        run: |
          cd device
          git init -q
          git config user.email ci@localhost
          git config user.name ci
          git config commit.gpgsign false
          git add -A
          git commit -qm "fuxi device tree"
          test ! -f .gitmodules

      - name: Download the prepared tree
        uses: actions/download-artifact@v4
        with:
          name: unixnu-prepared-${{ github.run_attempt }}
          path: ${{ runner.temp }}/prepared

      - name: Restore the fetched sources
        run: |
          cd unixnu
          tar -xJf "$RUNNER_TEMP/prepared/unixnu-out.tar.xz"
          ls out | head -n 20
          df -h /

      - name: Configure
        run: ./unixnu defconfig "$DEFCONFIG" -D "$UNIXNU_DEVICE"
        working-directory: unixnu

      # Same pin as in prepare, because the driver may re-link refer/xnu from the feeds.
      - name: Pin the XNU reference revision
        env:
          UNIXNU_XNU_TAG: xnu-10063.141.1
          UNIXNU_XNU_COMMIT: d8b80295118ef25ac3a784134bcf95cd8e88109f
          UNIXNU_XNU_VERSION: 10063.141.1
        run: |
          XNU=out/fuxi/tree/refer/xnu
          if [ "$(git -C "$XNU" rev-parse HEAD 2>/dev/null || true)" != "$UNIXNU_XNU_COMMIT" ]; then
            rm -rf "$XNU"
            mkdir -p "$(dirname "$XNU")"
            git clone -q --depth 1 --branch "$UNIXNU_XNU_TAG" \
              https://github.com/apple-oss-distributions/xnu.git "$XNU"
          fi
          test "$(git -C "$XNU" rev-parse HEAD)" = "$UNIXNU_XNU_COMMIT"
          git -C "$XNU" rev-parse HEAD
        working-directory: unixnu

      - name: Build kernel
        timeout-minutes: 200
        run: ./unixnu build "$STEPS"
        working-directory: unixnu

      - name: Collect the results
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/result"
          find out -maxdepth 6 -name 'kernel.macho' -exec cp {} "$RUNNER_TEMP/result/" \; || true
          find out -maxdepth 6 -name '*.log' -exec cp {} "$RUNNER_TEMP/result/" \; || true
          ls -la "$RUNNER_TEMP/result" | head -n 40
          df -h "$GITHUB_WORKSPACE"
        working-directory: unixnu

      - name: Upload the kernel and the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuxi-kernel-${{ github.run_attempt }}
          path: ${{ runner.temp }}/result/*
          retention-days: 3
          if-no-files-found: warn

      - name: Summary
        if: always()
        run: |
          echo "defconfig: $DEFCONFIG" >> "$GITHUB_STEP_SUMMARY"
          echo "steps: $STEPS" >> "$GITHUB_STEP_SUMMARY"
          du -sh "$RUNNER_TEMP/result" 2>/dev/null || true
